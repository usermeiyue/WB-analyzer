<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:14px system-ui;color:#334155}canvas{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair;border:1px solid #cbd5e1;border-radius:6px}p{margin:8px 0;line-height:1.5}</style></head><body><canvas id="canvas"></canvas><p id="hint"></p><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let args={},image=new Image(),start=null,end=null,nonce=0,box=null,action=null,initial=null,edge=null,gestureLane=null,gestureKind=null;
function send(type,fields={}){window.parent.postMessage({isStreamlitMessage:true,type,...fields},'*')}
let lastFrameHeight=0;
function fitCanvas(){if(!image.width)return;const limit=args.max_display_height;if(limit){const available=(document.documentElement&&document.documentElement.clientWidth)||window.innerWidth||image.width;const scale=Math.min(available/image.width,limit/image.height);canvas.style.width=Math.floor(image.width*scale)+'px';canvas.style.height=Math.floor(image.height*scale)+'px';}else{canvas.style.width='100%';canvas.style.height='auto';}}
function height(){const bounds=canvas.getBoundingClientRect();const hint=document.getElementById('hint');const hintHeight=hint.getBoundingClientRect?hint.getBoundingClientRect().height:24;const pixels=Math.ceil((bounds.height||0)+hintHeight+24);if(pixels!==lastFrameHeight){lastFrameHeight=pixels;send('streamlit:setFrameHeight',{height:pixels})}}

function view(){return args.viewport||[0,0,args.raw_width,args.raw_height]}
function local(u,v,b){let t=b.angle*Math.PI/180,c=Math.cos(t),s=Math.sin(t);return{x:b.rect[0]+b.rect[2]/2+u*c-v*s,y:b.rect[1]+b.rect[3]/2+u*s+v*c}}
function toLocal(p,b){let cx=b.rect[0]+b.rect[2]/2,cy=b.rect[1]+b.rect[3]/2,t=b.angle*Math.PI/180;return{x:(p.x-cx)*Math.cos(t)+(p.y-cy)*Math.sin(t),y:-(p.x-cx)*Math.sin(t)+(p.y-cy)*Math.cos(t)}}
function drawBox(b,handles){let v=view(),sx=canvas.width/v[2],sy=canvas.height/v[3],screen=canvas.width/canvas.getBoundingClientRect().width,w=b.rect[2],h=b.rect[3];let pts=[local(-w/2,-h/2,b),local(w/2,-h/2,b),local(w/2,h/2,b),local(-w/2,h/2,b)];ctx.strokeStyle=b.color||'#3b82f6';ctx.fillStyle=b.color||'#3b82f6';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo((p.x-v[0])*sx,(p.y-v[1])*sy):ctx.moveTo((p.x-v[0])*sx,(p.y-v[1])*sy));ctx.closePath();ctx.stroke();if(handles){let top=local(0,-h/2,b),knob=local(0,-h/2-26/sy,b);if(args.allow_rotation!==false){ctx.beginPath();ctx.moveTo((top.x-v[0])*sx,(top.y-v[1])*sy);ctx.lineTo((knob.x-v[0])*sx,(knob.y-v[1])*sy);ctx.stroke()}for(const p of (args.fixed_size?(args.allow_rotation===false?[]:[knob]):[...pts,local(0,-h/2,b),local(w/2,0,b),local(0,h/2,b),local(-w/2,0,b),...(args.allow_rotation===false?[]:[knob])])){ctx.beginPath();ctx.arc((p.x-v[0])*sx,(p.y-v[1])*sy,6*screen,0,Math.PI*2);ctx.fill()}ctx.font=`${14*screen}px sans-serif`;if(args.allow_rotation!==false)ctx.fillText(b.angle.toFixed(1)+'°',(knob.x-v[0])*sx+10,(knob.y-v[1])*sy)}else if(b.label){ctx.font=`${14*screen}px sans-serif`;ctx.fillText(b.label,(pts[0].x-v[0])*sx,Math.max(12,(pts[0].y-v[1])*sy-4))}}
function render(){if(!image.width)return;canvas.width=image.width;canvas.height=image.height;fitCanvas();ctx.drawImage(image,0,0);ctx.lineWidth=Math.max(1.5,canvas.width/700);for(const r of args.rectangles||[])drawBox({...r,angle:r.angle||0},false);if(box&&args.mode==='crop'){box.color=args.crop_color||'#3b82f6';drawBox(box,true)}if(start&&end&&action==='new'&&args.mode!=='crop'){drawBox({rect:[Math.min(start.x,end.x),Math.min(start.y,end.y),Math.abs(end.x-start.x),Math.abs(end.y-start.y)],angle:0,color:'#ef4444'},false)}height()}
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;const incoming=e.data.args;if(incoming.context!==args.context||incoming.revision!==args.revision){start=end=null;action=null;}args=incoming;document.getElementById('hint').textContent=args.hint||'拖选裁剪';if(!start)box=args.crop?{rect:[...args.crop],angle:args.angle||0,color:args.crop_color||'#3b82f6'}:null;const prev=image.src;if(prev!==args.image){image=new Image();image.onload=render;image.src=args.image}else render()});
function point(e){const r=canvas.getBoundingClientRect(),v=view();return{x:Math.max(0,Math.min(args.raw_width,v[0]+(e.clientX-r.left)/r.width*v[2])),y:Math.max(0,Math.min(args.raw_height,v[1]+(e.clientY-r.top)/r.height*v[3]))}}
canvas.onpointerdown=e=>{
 start=point(e);end=start;initial=box?JSON.parse(JSON.stringify(box)):null;action='new';gestureLane=args.lane;gestureKind=args.kind||'signal';
 const v=view(),tol=8*v[2]/canvas.getBoundingClientRect().width;
 if(args.edit_tool&&args.edit_tool!=='draw'){
  const inside=b=>{const q=toLocal(start,{...b,angle:b.angle||0});return Math.abs(q.x)<=b.rect[2]/2+tol&&Math.abs(q.y)<=b.rect[3]/2+tol};
  const hit=box&&inside(box)?null:[...(args.rectangles||[])].reverse().find(r=>r.selectable&&inside(r));
  if(hit){box={rect:[...hit.rect],angle:hit.angle||0};initial=JSON.parse(JSON.stringify(box));gestureLane=hit.lane;gestureKind=hit.kind||'signal'}
  if(!box){action='new'}else if(!(hit||inside(box))){start=end=null;action=null;return}else if(args.edit_tool==='move'){action='move'}else{action='select';const q=toLocal(start,box),w=box.rect[2],h=box.rect[3];if(Math.abs(Math.abs(q.x)-w/2)<tol&&Math.abs(Math.abs(q.y)-h/2)<tol)action='resize';else if(Math.abs(Math.abs(q.x)-w/2)<tol){action='edge';edge=q.x<0?'left':'right'}else if(Math.abs(Math.abs(q.y)-h/2)<tol){action='edge';edge=q.y<0?'top':'bottom'}}
 }else if(!args.edit_tool&&box&&args.mode==='crop'){
  const q=toLocal(start,box),w=box.rect[2],h=box.rect[3],sy=canvas.height/v[3],knob=local(0,-h/2-26/sy,box),t=Math.min(tol,Math.min(w,h)*.2);
  if(args.allow_rotation!==false&&Math.hypot(start.x-knob.x,start.y-knob.y)<t)action='rotate';
  else if(!args.fixed_size&&Math.abs(Math.abs(q.x)-w/2)<t&&Math.abs(Math.abs(q.y)-h/2)<t)action='resize';
  else if(!args.fixed_size&&Math.abs(Math.abs(q.x)-w/2)<t&&Math.abs(q.y)<h/2){action='edge';edge=q.x<0?'left':'right'}
  else if(!args.fixed_size&&Math.abs(Math.abs(q.y)-h/2)<t&&Math.abs(q.x)<w/2){action='edge';edge=q.y<0?'top':'bottom'}
  else if(Math.abs(q.x)<w/2&&Math.abs(q.y)<h/2)action='move';
 }
 if(!args.edit_tool&&args.mode==='crop'&&action==='new'){
  const hit=[...(args.rectangles||[])].reverse().find(r=>{if(!r.selectable)return false;const q=toLocal(start,{...r,angle:r.angle||0});return Math.abs(q.x)<=r.rect[2]/2+tol&&Math.abs(q.y)<=r.rect[3]/2+tol});
  if(hit){send('streamlit:setComponentValue',{value:{action:'select',lane:hit.lane,kind:hit.kind,mode:args.mode,revision:args.revision,context:args.context,nonce:Date.now()+'-'+(++nonce)},dataType:'json'});start=end=null;action=null;return}
 }
 canvas.setPointerCapture(e.pointerId);render();
};
canvas.onpointermove=e=>{if(!start)return;end=point(e);if(args.mode==='crop'){if(action==='new'&&args.fixed_size){const [w,h]=args.fixed_size;box={rect:[end.x-w/2,end.y-h/2,w,h],angle:0}}else if(action==='new'){let w=Math.abs(end.x-start.x),h=Math.abs(end.y-start.y);if(args.aspect>0)h=w/args.aspect;let x=Math.min(start.x,end.x),y=end.y>=start.y?start.y:start.y-h;box={rect:[x,y,w,h],angle:0}}else if(action==='move'){box={rect:[initial.rect[0]+end.x-start.x,initial.rect[1]+end.y-start.y,initial.rect[2],initial.rect[3]],angle:initial.angle}}else if(action==='rotate'){const cx=initial.rect[0]+initial.rect[2]/2,cy=initial.rect[1]+initial.rect[3]/2;let t=(Math.atan2(end.y-cy,end.x-cx)-Math.atan2(start.y-cy,start.x-cx))*180/Math.PI;box={rect:[...initial.rect],angle:Math.max(-45,Math.min(45,initial.angle+t))}}else if(action==='edge'){const q=toLocal(end,initial);let l=-initial.rect[2]/2,r=initial.rect[2]/2,t=-initial.rect[3]/2,b=initial.rect[3]/2;if(edge==='left')l=Math.min(r-2,q.x);if(edge==='right')r=Math.max(l+2,q.x);if(edge==='top')t=Math.min(b-2,q.y);if(edge==='bottom')b=Math.max(t+2,q.y);let w=r-l,h=b-t;if(args.aspect>0){if(edge==='left'||edge==='right')h=w/args.aspect;else w=h*args.aspect}let center=local((l+r)/2,(t+b)/2,initial);box={rect:[center.x-w/2,center.y-h/2,w,h],angle:initial.angle}}else if(action==='resize'){const q=toLocal(end,initial);let w=Math.max(2,Math.abs(q.x)*2),h=args.aspect>0?w/args.aspect:Math.max(2,Math.abs(q.y)*2);const cx=initial.rect[0]+initial.rect[2]/2,cy=initial.rect[1]+initial.rect[3]/2;box={rect:[cx-w/2,cy-h/2,w,h],angle:initial.angle}}}if(args.edit_tool&&box){const r=box.rect;r[2]=Math.min(args.raw_width,Math.max(2,r[2]));r[3]=Math.min(args.raw_height,Math.max(2,r[3]));r[0]=Math.max(0,Math.min(args.raw_width-r[2],r[0]));r[1]=Math.max(0,Math.min(args.raw_height-r[3],r[1]));}render()};
canvas.onpointercancel=()=>{box=initial;start=end=null;render()};
canvas.onpointerup=e=>{
 if(!start)return;
 const r=canvas.getBoundingClientRect(),v=view(),distance=Math.hypot((point(e).x-start.x)*r.width/v[2],(point(e).y-start.y)*r.height/v[3]);
 if(distance<3){box=initial;if(gestureLane!==args.lane||gestureKind!==(args.kind||'signal'))send('streamlit:setComponentValue',{value:{action:'select',lane:gestureLane,kind:gestureKind,mode:args.mode,revision:args.revision,context:args.context,nonce:Date.now()+'-'+(++nonce)},dataType:'json'});start=end=null;render();return}
 canvas.onpointermove(e);
 const rect=(args.mode==='crop'&&box?box.rect:[Math.min(start.x,end.x),Math.min(start.y,end.y),Math.abs(end.x-start.x),Math.abs(end.y-start.y)]).map(Math.round);
 if(rect[2]>=1&&rect[3]>=1){send('streamlit:setComponentValue',{value:{rect,angle:args.mode==='crop'?box.angle:0,mode:args.mode,lane:gestureLane??args.lane,kind:gestureKind,revision:args.revision,context:args.context,nonce:Date.now()+'-'+(++nonce)},dataType:'json'})}else box=initial;
 start=end=null;render();
};window.addEventListener('resize',()=>{fitCanvas();height()});send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
